# Runs the checks that don't need the ROMs, then publishes the password generator page.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Codec round-trips the published passwords
        run: node test.mjs
      - name: Page footer and README badge match the CHANGELOG version
        run: |
          v=$(grep -m1 -oP '^## \K[0-9.]+' CHANGELOG.md)
          grep -q ">v$v</a>" index.html || { echo "Page footer isn't v$v"; exit 1; }
          grep -qF "badge/version-$v-" README.md || { echo "README badge isn't $v"; exit 1; }

  pages:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page files
        run: mkdir site && cp -r index.html rnrr.js characters.png rock_n_roll_racing_logo.png planets upgrades cars site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
